<!doctype html><meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:#070F30;font-family:'Plus Jakarta Sans','Inter','Helvetica Neue',Arial,sans-serif;color:#fff}
.s{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{width:760px;border-radius:24px}
h1{font-size:104px;line-height:1.08;font-weight:800;max-width:1500px;letter-spacing:-2px}
h2{font-size:78px;font-weight:800}
.o{color:#F46219}
p{font-size:38px;color:#b9c2e6;margin-top:28px}
.tag{font-size:30px;letter-spacing:6px;text-transform:uppercase;color:#F46219;font-weight:700;margin-bottom:30px}
.browser{position:absolute;width:1000px;height:690px;border-radius:18px;overflow:hidden;background:#111;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.bar{height:46px;background:#1b2350;display:flex;align-items:center;gap:10px;padding:0 18px}
.bar i{width:14px;height:14px;border-radius:50%;background:#F46219;opacity:.8}
.browser img{width:1000px;display:block}
.btn{margin-top:50px;background:#F46219;color:#fff;font-size:44px;font-weight:800;padding:26px 64px;border-radius:16px}
</style>
<div id=bg style="position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#16297a,#070F30 65%)"></div>
<div class=s id=s1 style="background:#fff"><img class=logo src=logo.png></div>
<div class=s id=s2><div class=tag>Antwerp &amp; surroundings</div><h1>Your business deserves a website that <span class=o>works.</span></h1></div>
<div class=s id=s3><h2 style="position:absolute;top:70px">Fully tailored. <span class=o>Fast. Affordable.</span></h2>
 <div class=browser id=b1><div class=bar><i></i><i></i><i></i></div><img src=bike-shop-demo.png></div>
 <div class=browser id=b2><div class=bar><i></i><i></i><i></i></div><img src=art-gallery-demo.png></div>
 <div class=browser id=b3><div class=bar><i></i><i></i><i></i></div><img src=video-store-demo.png></div></div>
<div class=s id=s4><h1>From restaurant to tradesperson —<br><span class=o>we build it.</span></h1></div>
<div class=s id=s5><img class=logo src=logo.png style="width:520px"><p style="color:#fff;font-size:56px;font-weight:700;margin-top:40px">Ready for a website that works?</p><div class=btn>info@warnierwebdesign.com</div><p>www.warnierwebdesign.com</p></div>
<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-cl(x),3);
// scene windows [start,end]
const W={s1:[0,3],s2:[3,7],s3:[7,13],s4:[13,16.5],s5:[16.5,20]};
function scene(id,t,y=40){const [a,b]=W[id],e=document.getElementById(id);
 const i=ease((t-a)/.6),o=ease((b-t)/.5);e.style.opacity=t<a||t>b?0:Math.min(i,o);
 e.style.transform=`translateY(${(1-i)*y}px) scale(${.96+.04*i})`;}
window.seek=t=>{
 for(const k in W)scene(k,t);
 document.getElementById('s1').querySelector('img').style.transform=`scale(${1+t*.02})`;
 // browsers
 const pos=[[80,-1],[460,0],[840,1]];
 [1,2,3].forEach((n,i)=>{const t0=7.8+i*1.4,e=document.getElementById('b'+n);
  const p=ease((t-t0)/.9);const out=ease((13-.5-t)/.4);
  const x=[60,460,860][i],y=[230,300,230][i];
  e.style.opacity=t<t0?0:Math.min(p,out);
  e.style.left=x+'px';e.style.top=(y+(1-p)*120)+'px';
  e.style.transform=`scale(.9) rotate(${[-3,0,3][i]}deg)`;e.style.zIndex=i;});
 document.getElementById('bg').style.backgroundPosition=`${t*10}px 0`;
};
seek(0);
</script>
